name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # A real sample on Linux: the JSON that would be sent.
      - run: cargo run -q -- once

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s sh dist/install.sh dist/uninstall.sh dist/check-embedded.sh
      - run: sh dist/check-embedded.sh

  # The same static builds release.yml makes, so a broken toolchain shows up
  # here instead of after a tag is pushed.
  release-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - run: pip install ziglang==0.17.0 cargo-zigbuild==0.24.1
      - run: cargo zigbuild --release --locked --target x86_64-unknown-linux-musl
      - run: cargo zigbuild --release --locked --target aarch64-unknown-linux-musl
