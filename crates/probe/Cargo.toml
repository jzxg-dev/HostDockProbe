[package]
name = "hostdock-probe"
version = "0.1.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Read-only metrics probe for HostDock"
publish = false

[dependencies]
flate2 = "1.1.10"
rustix = { version = "1.1.6", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.0"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
