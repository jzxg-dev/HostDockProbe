# cargo deny: licenses, known vulnerabilities, sources. Run in CI on every push.

[graph]
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]

[advisories]
version = 2

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    # webpki-roots: the Mozilla root certificate list.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# The probe must not link OpenSSL or pull in an async runtime.
deny = [
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "native-tls" },
    { crate = "tokio" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
